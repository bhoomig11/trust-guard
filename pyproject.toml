[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trustguard"
version = "0.1.0"
description = "Secure enterprise retrieval and compliance agent with PII masking and audit logging."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.4,<3",
    "chromadb>=1.5,<2",
    "fastapi>=0.162,<1",
    "langchain-text-splitters>=1.1,<2",
    "pandas>=2.2",
    "presidio-analyzer>=2.2.366,<3",
    "presidio-anonymizer>=2.2.366,<3",
    "pydantic-settings>=2.16,<3",
    "pypdf>=6.21,<7",
    "python-multipart>=0.0.33",
    "sentence-transformers>=6.2,<7",
    "uvicorn[standard]>=0.54,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "reportlab>=5.1",
    "ruff>=0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=trustguard --cov-report=term-missing --cov-fail-under=85"
markers = ["slow: loads the real embedding model"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["trustguard"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "D", "ANN"]
ignore = ["D105", "D107", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"scripts/**" = ["D103"]
"scripts/mock_policy_content.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["trustguard"]
ignore_missing_imports = true
warn_unused_ignores = false
